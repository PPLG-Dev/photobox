name: photobox

x-base-services: &base-service
    env_file: .env
    networks: ["internal", "proxy-net"]
    extra_hosts: ["host.docker.internal:host-gateway"]

services:
    db:
        <<: *base-service
        image: mysql:8.1
        hostname: db
        ports: ["3306:3306"]
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_USER: ${DB_USERNAME:-laravel}
            MYSQL_PASSWORD: ${DB_PASSWORD:-password}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
        volumes: ["mysql-data:/var/lib/mysql"]

    phpmyadmin:
        <<: *base-service
        image: phpmyadmin
        environment:
            PMA_ARBITRARY: 1
            PMA_HOST: db
        ports: ["8880:80"]

    redis:
        <<: *base-service
        image: redis:alpine
        ports: ["6379:6379"]

volumes:
    mysql-data:

networks:
    internal:
    proxy-net:
        external: true
